
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Valuable Variety — Independent record label.">
  <title>VV — Valuable Variety</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: -2px;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 5%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 9px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#home" class="logo">VV</a>

    <nav>
      <a href="#home">Home</a>
      <a href="#releases">Releases</a>
      <a href="#artists">Artists</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
    </section>

    <section id="releases"></section>
    <section id="artists"></section>
    <section id="about"></section>
    <section id="contact"></section>
  </main>

</body>
</html>
