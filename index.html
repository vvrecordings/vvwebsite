
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Valuable Variety — Independent record label.">
  <title>VV — Valuable Variety</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -15px;
      background-image: url("Artboard%201%20born.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(12px) brightness(1);
      transition: filter 0.5s ease;
      z-index: 0;
    }

    .hero.active::before {
      filter: blur(0px) brightness(0.45);
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(32px, 5vw, 64px);
      font-weight: normal;
      color: #fff;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: 1;
    }

    .hero-text.hidden {
      opacity: 0;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 5%;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 9px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="#home" class="logo">VV</a>

    <nav>
      <a href="#releases">Releases</a>
      <a href="#artists">Artist</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-text" id="heroText">
        Valuable Variety
      </div>
    </section>

    <section id="releases"></section>
    <section id="artists"></section>
    <section id="about"></section>
    <section id="contact"></section>
  </main>

  <script>
    const hero = document.querySelector(".hero");
    const heroText = document.getElementById("heroText");
    const navigationLinks = document.querySelectorAll("nav a");
    const homeLink = document.querySelector(".logo");

    navigationLinks.forEach(link => {
      link.addEventListener("click", () => {
        hero.classList.add("active");
        heroText.classList.add("hidden");
      });
    });

    homeLink.addEventListener("click", () => {
      hero.classList.remove("active");
      heroText.classList.remove("hidden");
    });
  </script>

</body>
</html>
